<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Tidy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <h1>Tab Tidy</h1>
            <p id="tabSummary" aria-live="polite">正在读取标签页…</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="shortcutButton" class="secondary-button" type="button" title="配置快捷键">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h.01M11 14h6"></path></svg>
            <span>快捷键</span>
          </button>
          <button id="dedupeButton" class="primary-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 7V5.8C8 4.8 8.8 4 9.8 4h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H17M5.8 8h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H5.8c-1 0-1.8-.8-1.8-1.8V9.8C4 8.8 4.8 8 5.8 8Z" />
            </svg>
            <span id="dedupeLabel">检查重复页</span>
          </button>
        </div>
      </header>

      <section class="controls" aria-label="标签页工具">
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索标题或网址" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="view-switch" role="group" aria-label="切换视图">
          <button class="view-button is-active" type="button" data-view="compact" aria-pressed="true" title="默认视图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>
            <span>默认</span>
          </button>
          <button class="view-button" type="button" data-view="icon" aria-pressed="false" title="仅标签图标">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="12" cy="6" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="6" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="18" cy="12" r="2"></circle><circle cx="6" cy="18" r="2"></circle><circle cx="12" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
            <span>仅标签</span>
          </button>
          <button class="view-button" type="button" data-view="detail" aria-pressed="false" title="标签和标题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3v3H4zM10 7.5h10M4 11h3v3H4zM10 12.5h10M4 16h3v3H4zM10 17.5h10"></path></svg>
            <span>标签 + 标题</span>
          </button>
        </div>
      </section>

      <section class="selection-bar" aria-label="批量操作">
        <label class="select-all">
          <input id="selectAllCheckbox" type="checkbox" />
          <span>全选结果</span>
        </label>
        <span id="resultCount" class="result-count">0 个结果</span>
        <button id="closeSelectedButton" class="danger-button" type="button" disabled>
          关闭所选 <span id="selectedCount">0</span>
        </button>
      </section>

      <section id="tabList" class="tab-list compact-view" aria-label="所有标签页"></section>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">⌕</div>
        <h2>没有匹配的标签页</h2>
        <p>换个关键词试试。</p>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
