<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Tidy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <h1 data-i18n="extensionName">Tab Tidy</h1>
            <p id="tabSummary" aria-live="polite" data-i18n="loadingTabs">Loading tabs…</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="shortcutButton" class="secondary-button" type="button" title="Configure shortcuts" data-i18n-title="configureShortcuts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h.01M11 14h6"></path></svg>
            <span data-i18n="shortcutSettings">Shortcuts</span>
          </button>
          <button id="dedupeButton" class="primary-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 7V5.8C8 4.8 8.8 4 9.8 4h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H17M5.8 8h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H5.8c-1 0-1.8-.8-1.8-1.8V9.8C4 8.8 4.8 8 5.8 8Z" />
            </svg>
            <span id="dedupeLabel" data-i18n="checkDuplicates">Check duplicates</span>
          </button>
        </div>
      </header>

      <section class="controls" aria-label="Tab tools" data-i18n-aria-label="tabTools">
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Search titles or URLs" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="view-switch" role="group" aria-label="Switch view" data-i18n-aria-label="switchView">
          <button class="view-button is-active" type="button" data-view="compact" aria-pressed="true" title="Default view" data-i18n-title="defaultViewTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>
            <span data-i18n="defaultView">Default</span>
          </button>
          <button class="view-button" type="button" data-view="icon" aria-pressed="false" title="Tab icons only" data-i18n-title="iconsOnlyViewTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="12" cy="6" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="6" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="18" cy="12" r="2"></circle><circle cx="6" cy="18" r="2"></circle><circle cx="12" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
            <span data-i18n="iconsOnlyView">Icons only</span>
          </button>
          <button class="view-button" type="button" data-view="detail" aria-pressed="false" title="Tab icon and title" data-i18n-title="detailViewTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3v3H4zM10 7.5h10M4 11h3v3H4zM10 12.5h10M4 16h3v3H4zM10 17.5h10"></path></svg>
            <span data-i18n="detailView">Icon + title</span>
          </button>
        </div>
      </section>

      <section class="selection-bar" aria-label="Bulk actions" data-i18n-aria-label="bulkActions">
        <label class="select-all">
          <input id="selectAllCheckbox" type="checkbox" />
          <span data-i18n="selectAllResults">Select all results</span>
        </label>
        <span id="resultCount" class="result-count">0 results</span>
        <button id="closeSelectedButton" class="danger-button" type="button" disabled>
          <span data-i18n="closeSelected">Close selected</span> <span id="selectedCount">0</span>
        </button>
      </section>

      <section id="tabList" class="tab-list compact-view" aria-label="All tabs" data-i18n-aria-label="allTabs"></section>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">⌕</div>
        <h2 data-i18n="noMatches">No matching tabs</h2>
        <p data-i18n="tryAnotherSearch">Try another search.</p>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
